<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 64" width="232" height="64"
     fill="none" role="img" aria-label="SlideCast">
  <title>SlideCast</title>
  <defs>
    <linearGradient id="scCardL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
  </defs>

  <g transform="translate(-2.32 9) scale(0.72)">
    <rect x="6" y="11.5" width="46" height="25.9" rx="4.5"
          stroke="currentColor" stroke-width="2.6" stroke-opacity="0.4"/>
    <rect x="9" y="19" width="46" height="25.9" rx="4.5"
          stroke="currentColor" stroke-width="2.6" stroke-opacity="0.72"/>
    <rect x="12" y="26.5" width="46" height="25.9" rx="5" fill="url(#scCardL)"/>
  </g>

  <text x="46" y="42.5"
        font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif"
        font-size="29" font-weight="800" letter-spacing="-0.6">
    <tspan fill="currentColor">Slide</tspan><tspan fill="#ff9a3d">Cast</tspan>
