<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     fill="none" role="img" aria-label="SlideCast">
  <title>SlideCast</title>
  <defs>
    <linearGradient id="scTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13161f"/><stop offset="1" stop-color="#07080c"/>
    </linearGradient>
    <linearGradient id="scCardI" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#scTile)"/>
  <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="13.4"
        stroke="#ffffff" stroke-opacity="0.09"/>

  <g transform="translate(32 32) scale(0.82) translate(-32 -32)">
    <rect x="6" y="11.5" width="46" height="25.9" rx="4.5"
          stroke="#eef1f7" stroke-width="2.6" stroke-opacity="0.4"/>
    <rect x="9" y="19" width="46" height="25.9" rx="4.5"
          stroke="#eef1f7" stroke-width="2.6" stroke-opacity="0.72"/>
    <rect x="12" y="26.5" width="46" height="25.9" rx="5" fill="url(#scCardI)"/>
  </g>
</svg>
