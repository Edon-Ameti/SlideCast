<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     fill="none" role="img" aria-label="SlideCast">
  <title>SlideCast</title>
  <defs>
    <linearGradient id="scWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
  </defs>

  <!-- A slide that ends in a waveform: the frame stops, the voice carries the
       bottom edge. One outline doing both jobs. -->
  <path d="M 11 45 A 4 4 0 0 1 7 41 L 7 23 A 4 4 0 0 1 11 19 L 53 19 A 4 4 0 0 1 57 23 L 57 41 A 4 4 0 0 1 53 45"
        stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <path d="M 53 45 C 49 45 47 40 43 40 C 39 40 36 50 32 50 C 28 50 25 40 21 40 C 17 40 15 45 11 45"
        stroke="url(#scWave)" stroke-width="3.2" stroke-linecap="round"/>
</svg>
