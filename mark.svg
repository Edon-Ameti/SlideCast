<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     fill="none" role="img" aria-label="SlideCast">
  <title>SlideCast</title>
  <defs>
    <linearGradient id="scCard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
  </defs>

  <!-- A deck: three 16:9 slides of the same size, the front one lit. They lean
       up-left rather than up-right, which is what keeps it from reading as a
       folder icon. -->
  <rect x="6" y="11.5" width="46" height="25.9" rx="4.5"
        stroke="currentColor" stroke-width="2.6" stroke-opacity="0.4"/>
  <rect x="9" y="19" width="46" height="25.9" rx="4.5"
        stroke="currentColor" stroke-width="2.6" stroke-opacity="0.72"/>
  <rect x="12" y="26.5" width="46" height="25.9" rx="5" fill="url(#scCard)"/>
</svg>
