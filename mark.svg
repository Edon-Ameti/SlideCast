<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     fill="none" role="img" aria-label="slidecast">
  <title>slidecast</title>
  <defs>
    <linearGradient id="scWave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
  </defs>

  <!-- the slide, frame takes the surrounding text colour -->
  <rect x="5" y="21" width="30" height="22" rx="3.5"
        stroke="currentColor" stroke-width="2.8"/>

  <!-- content, then the burned-in subtitle sitting low like a real caption -->
  <rect x="11" y="27" width="13" height="2.6" rx="1.3"
        fill="currentColor" opacity="0.45"/>
  <rect x="11" y="36.4" width="18" height="2.8" rx="1.4" fill="#ff9a3d"/>

  <!-- cast: waves off the slide's edge, fading as they travel -->
  <g stroke="url(#scWave)" stroke-width="3" stroke-linecap="round">
    <path d="M 40.162 24.628 A 9 9 0 0 1 40.162 39.372"/>
    <path d="M 44.177 18.894 A 16 16 0 0 1 44.177 45.106" opacity="0.66"/>
    <path d="M 48.192 13.160 A 23 23 0 0 1 48.192 50.840" opacity="0.36"/>
  </g>
</svg>
